[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphspec"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy==2.5.3", "numba==0.67.0", "torch>=2.4", "pyarrow>=25", "optuna==5.0.0", "botorch==0.18.1", "scikit-learn>=1.6", "scipy>=1.14", "psutil>=6.0"]

[tool.setuptools.packages.find]
include = ["graphspec*", "tuning*"]

[tool.setuptools.package-data]
tuning = ["web/*.html", "web/*.css", "web/*.js"]

[project.scripts]
graphspec = "tuning.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff==0.16.7", "pytest-xdist>=3.8"]
ladybug = ["ladybug==0.20.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -n 2 --dist loadgroup -m \"not gpu and not slow\" --assert=plain"

[tool.ruff]
target-version = "py311"
line-length = 110
cache-dir = "${GRAPHSPEC_HOME}/cache/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"graphspec/__init__.py" = ["E402"]
