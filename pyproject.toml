[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphspec"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "numba>=0.60", "torch>=2.4", "pyarrow>=25"]

[tool.setuptools]
packages = ["graphspec", "tuning", "dashboard"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
