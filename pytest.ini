[pytest]
testpaths = tests/unit
pythonpath = .
python_files = test_*.py
addopts = -ra --strict-markers --strict-config --durations=10 --durations-min=0.005 -p no:cacheprovider --junitxml=tests/.results/junit.xml
junit_family = xunit2
junit_duration_report = total
markers =
    adhoc: data-heavy checks, model fitting, or framework-heavy validation
    integration: requires the project database
    gpu: requires CUDA and an idle GPU
